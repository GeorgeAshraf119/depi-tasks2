<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faceb00k-Login-Clone</title>
    <link rel="stylesheet" href="bootstrap.css">
</head>

<body class="bg-light overflow-x-hidden">
    <div class="row vh-100 justify-content-center align-items-center">
        
        <div class="col-lg-5">
            <h1 class="text-primary display-3 fw-bold mb-4 text-center text-lg-start">
                Faceb00k
            </h1>

            <h2 class="text-secondary fs-4 fw-medium text-center text-lg-start">
                Connect with friends and the world around you on Facebook.
            </h2>
        </div>

        <div class="col-lg-4">
            <div class="bg-white shadow p-5 rounded-3 d-flex flex-column gap-2 mb-3">
                <input class="rounded-1 border-1 p-2 mb-2" type="email"
                    placeholder="Email address or phone number">

                <input class="rounded-1 border-1 p-2 mb-2" type="password"
                    placeholder="Password">

                <div>
                    <input type="checkbox" id="showPassword">
                    <label class="text-primary fw-bold" for="showPassword">
                        Show Password
                    </label>
                </div>

                <button class="btn btn-primary fw-bold">Log In</button>
                <a class="text-center text-decoration-none" href="#">Forget Password?</a>

                <hr>

                <button class="btn btn-success">Create New Account</button>
            </div>

            <p class="text-center text-secondary">
                <a class="text-primary text-decoration-none fw-bold" href="#">
                    Create a Page
                </a>
                for a celebrity, brand or business.
            </p>
        </div>

    </div>

    <script src="bootstrap.bundle.js"></script>
</body>

</html>
